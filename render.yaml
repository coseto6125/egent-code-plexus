# Render Blueprint for the public ecp demo. Dashboard → New → Blueprint →
# this repository; every later deploy is the image push in
# .github/workflows/demo.yml followed by the deploy hook.
#
# `runtime: image` pulls the GHCR image the workflow publishes instead of
# building on Render, so the free plan's build minutes stay untouched and the
# same image can move to any other container host.
services:
  - type: web
    name: ecp-demo
    runtime: image
    image:
      url: ghcr.io/coseto6125/ecp-demo:latest
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: PORT
        value: 8080
      # Free instances get 0.1 CPU and 512 MB: one ecp at a time, generous
      # query timeout, small repositories only, few of them kept.
      - key: ECP_DEMO_CONCURRENCY
        value: 1
      - key: ECP_DEMO_TIMEOUT_SECS
        value: 20
      - key: ECP_DEMO_MAX_REPO_KB
        value: 30720
      - key: ECP_DEMO_MAX_REPOS
        value: 4
      - key: ECP_DEMO_INDEX_TIMEOUT_SECS
        value: 600
      # Raises the GitHub API quota for the size precheck; a fine-grained
      # token with no scopes is enough. Set it in the dashboard.
      - key: GITHUB_TOKEN
        sync: false
