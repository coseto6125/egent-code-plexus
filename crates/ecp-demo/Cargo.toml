[package]
name = "ecp-demo"
description = "Read-only web demo of ecp: an axum service that fronts the MCP tool surface over a fixed set of indexed corpora"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Deployable, not a library: shipped as a container image (see Dockerfile).
publish = false

[[bin]]
name = "ecp-demo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = "4.5"
# No version constraint on purpose: `cut-release.sh` bumps the four
# `workspace.dependencies` sites and would miss a fifth one here.
egent-code-plexus = { path = "../ecp-cli" }
ecp-mcp = { workspace = true }
include_dir = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "signal", "sync", "fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
